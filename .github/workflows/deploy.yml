name: CI/CD Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout repository code

jobs:
  lint-build-deploy:
    name: Build, Lint & Deploy to AWS S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter Gate
        run: npm run lint

      - name: Run Production Build
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TODO: Set secret AWS_ROLE_ARN in GitHub Repo Settings -> Secrets & Variables -> Actions
          # Example ARN: arn:aws:iam::123456789012:role/GitHubActionsDeployRole
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::ACCOUNT_ID:role/GitHubActionsDeployRole' }}
          role-session-name: GitHubActions-Deploy-Session
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Sync Static Assets to Amazon S3
        run: |
          # TODO: Set secret AWS_S3_BUCKET_NAME
          BUCKET_NAME="${{ secrets.AWS_S3_BUCKET_NAME || 'maleesha-portfolio-static-hosting-bucket' }}"
          echo "Syncing static distribution artifacts to s3://${BUCKET_NAME}..."
          
          # Upload static chunked assets with 1-year immutable cache
          aws s3 sync dist/ s3://${BUCKET_NAME}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          
          # Upload index.html with no-cache so browsers always fetch latest releases
          aws s3 cp dist/index.html s3://${BUCKET_NAME}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate Amazon CloudFront Edge Cache
        run: |
          # TODO: Set secret CLOUDFRONT_DISTRIBUTION_ID
          DISTRIBUTION_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'CLOUDFRONT_DIST_ID' }}"
          echo "Triggering CloudFront cache invalidation for distribution ${DISTRIBUTION_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id ${DISTRIBUTION_ID} \
            --paths "/*"
